name: AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04 : glibc plus ancienne, l'AppImage tourne aussi sur les distributions plus anciennes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: appimagetool
        run: |
          curl -fsSL -o packaging/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x packaging/appimagetool

      - name: AppImage
        run: packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FCDI_Apps-x86_64.AppImage
          path: FCDI_Apps-x86_64.AppImage

      # Sur main : publie une Release « vX.Y.Z » (version de Cargo.toml) si elle n'existe pas encore.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : augmenter la version dans Cargo.toml pour en publier une nouvelle."
          else
            NOTES=$(awk "/^## $VERSION/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
            gh release create "v$VERSION" FCDI_Apps-x86_64.AppImage \
              --title "FCDI Apps v$VERSION" --notes "${NOTES:-FCDI Apps v$VERSION}"
          fi
