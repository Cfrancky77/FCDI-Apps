[package]
name = "fcdi-apps"
version = "0.2.3"
edition = "2024"
description = "FCDI Apps : lanceur des applications FCDI (installation, mises à jour, lancement)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
dirs = "7.0.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "0.3.7", features = ["blocking"] }
rfd = "0.17"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[profile.release]
strip = true
lto = "thin"
