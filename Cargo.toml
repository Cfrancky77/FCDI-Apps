[package]
name = "fcdi-apps"
version = "0.1.0"
edition = "2024"
description = "FCDI Apps : lanceur des applications FCDI (installation, mises à jour, lancement)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[profile.release]
strip = true
lto = "thin"
